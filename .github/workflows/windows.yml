# Builds the Windows installer + portable exe on a real Windows runner, runs the
# Phase 0 SDK spike against a local Lore demo server, and smoke-tests the
# packaged app. Artifacts: LoreDesktop-<ver>-setup-x64.exe, -portable-x64.exe.
name: windows

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.28.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Install Lore CLI + server (demo)
        shell: pwsh
        env:
          LORE_INSTALL_DIR: ${{ runner.temp }}\lore-bin
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          irm https://raw.githubusercontent.com/EpicGames/lore/main/scripts/install.ps1 | iex
          $env:LORE_SERVER = 1
          irm https://raw.githubusercontent.com/EpicGames/lore/main/scripts/install.ps1 | iex
          "$env:LORE_INSTALL_DIR" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Phase 0 spike (SDK in Electron main on Windows)
        working-directory: spike
        run: |
          ../scripts/ci/start-loreserver.ps1
          npm ci --no-audit --no-fund
          npx electron sdk-spike.mjs
          npx electron sdk-spike-online.mjs lore://127.0.0.1:41337

      - name: Integration tests (SdkBackend against real Lore)
        env:
          LORE_IT_REMOTE: lore://127.0.0.1:41337
        run: |
          ./scripts/ci/start-loreserver.ps1
          pnpm test:it

      - name: Package (NSIS installer + portable)
        run: pnpm dist:win:native

      - name: Smoke-test packaged app (mock)
        run: node scripts/smoke-mock.cjs "--exe=dist/win-unpacked/Lore Desktop.exe" smoke-mock.png

      - name: Smoke-test packaged app (SDK, real repository)
        shell: pwsh
        run: |
          ./scripts/ci/start-loreserver.ps1
          $repo = Join-Path $env:RUNNER_TEMP 'DesktopDemo'
          New-Item -ItemType Directory -Force $repo | Out-Null
          Push-Location $repo
          lore --non-interactive repository create lore://127.0.0.1:41337/DesktopDemo
          New-Item -ItemType Directory Source | Out-Null
          Set-Content Source/main.cpp 'int main(){}'
          Set-Content Game.ini 'cfg=1'
          lore --non-interactive stage --scan .
          lore --non-interactive commit "Initial import"
          lore --non-interactive push
          Set-Content Source/main.cpp 'int main(){return 1;}'
          Set-Content Source/new.h 'new'
          lore --non-interactive stage Source/main.cpp
          Pop-Location
          node scripts/smoke-sdk.cjs "--exe=dist/win-unpacked/Lore Desktop.exe" $repo smoke-sdk.png | Tee-Object smoke-sdk.json
          $r = Get-Content smoke-sdk.json -Raw | ConvertFrom-Json
          if (-not ($r.rows | Where-Object { $_[0] -eq 'Source/main.cpp' -and $_[1] -eq 'staged' })) { throw "main.cpp not shown as staged" }
          if (-not ($r.rows | Where-Object { $_[0] -eq 'Source/new.h' -and $_[1] -eq 'untracked' })) { throw "new.h not shown as untracked" }
          # Core loop through the UI: watcher -> stage -> commit -> push.
          node scripts/smoke-sdk-loop.cjs "--exe=dist/win-unpacked/Lore Desktop.exe" $repo smoke-sdk-loop.png

      - uses: actions/upload-artifact@v6
        with:
          name: LoreDesktop-windows-x64
          path: |
            dist/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-screenshots
          path: |
            smoke-*.png
            smoke-sdk.json
          if-no-files-found: ignore
